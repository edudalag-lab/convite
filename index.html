<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite Eduardo & Leila</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #120b07;
        }

        .tela {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TELA DA ETIQUETA */

        #telaEtiqueta {
            opacity: 1;
            transition: opacity 0.7s ease;
        }

        #grupoEtiqueta {
            position: relative;
            width: min(96vw, 900px);
            max-height: 94vh;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;

            filter: drop-shadow(
                0 22px 44px rgba(0, 0, 0, 0.62)
            );

            transform-origin: 19% 52%;

            transition:
                transform 1s cubic-bezier(.22, .75, .25, 1),
                opacity 0.7s ease,
                filter 0.3s ease;
        }

        #grupoEtiqueta:hover {
            transform: scale(1.012);

            filter: drop-shadow(
                0 28px 52px rgba(0, 0, 0, 0.7)
            );
        }

        #grupoEtiqueta.soltar {
            transform:
                translate(5vw, 31vh)
                rotate(13deg)
                scale(0.88);

            opacity: 0;
        }

        #etiqueta {
            display: block;
            width: 100%;
            height: auto;
            max-height: 94vh;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        /* NOME PERSONALIZADO */

        #nomeConvidado {
            position: absolute;

            left: 31%;
            right: 15%;
            top: 55%;

            transform: translateY(-50%);

            text-align: center;
            white-space: nowrap;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(24px, 4.2vw, 60px);
            font-weight: 500;
            letter-spacing: 1px;

            color: #3b210f;

            text-shadow:
                0 1px 0 rgba(255, 228, 170, 0.55),
                0 2px 3px rgba(70, 35, 10, 0.35);

            pointer-events: none;
        }

        #nomeConvidado.nomeLongo {
            font-size: clamp(20px, 3.3vw, 48px);
        }

        #nomeConvidado.nomeMuitoLongo {
            font-size: clamp(17px, 2.7vw, 39px);
        }

        /* TELA DO CONVITE */

        #telaConvite {
            visibility: hidden;
            opacity: 0;

            background: #120b07;

            transition:
                opacity 1.15s ease;
        }

        #convite {
            width: 118vw;
            height: 118vh;

            object-fit: contain;

            transform: scale(1.18);
            filter: brightness(0.86);

            transition:
                transform 1.15s ease,
                filter 1.15s ease;
        }

        #telaConvite.aberto {
            visibility: visible;
            opacity: 1;
        }

        #telaConvite.aberto #convite {
            transform: scale(1.23);
            filter: brightness(1);
        }

        /* AJUSTE PARA CELULAR */

        @media (max-width: 600px) {
            #grupoEtiqueta {
                width: 98vw;
                max-height: 90vh;
            }

            #grupoEtiqueta.soltar {
                transform:
                    translate(4vw, 27vh)
                    rotate(11deg)
                    scale(0.86);

                opacity: 0;
            }

            #etiqueta {
                max-height: 90vh;
            }

            #nomeConvidado {
                left: 30%;
                right: 14%;
                top: 55%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #grupoEtiqueta,
            #telaEtiqueta,
            #telaConvite,
            #convite {
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>

<body>

    <section
        id="telaEtiqueta"
        class="tela">

        <div id="grupoEtiqueta">

            <img
                id="etiqueta"
                src="etiqueta_limpa.png.png"
                alt="Etiqueta destinada ao convidado">

            <div id="nomeConvidado">
                Convidado Especial
            </div>

        </div>

    </section>

    <section
        id="telaConvite"
        class="tela">

        <img
            id="convite"
            src="oficial.png"
            alt="Convite de Eduardo e Leila">

    </section>

    <script>
        const grupoEtiqueta =
            document.getElementById("grupoEtiqueta");

        const nomeConvidado =
            document.getElementById("nomeConvidado");

        const telaEtiqueta =
            document.getElementById("telaEtiqueta");

        const telaConvite =
            document.getElementById("telaConvite");

        const parametros =
            new URLSearchParams(window.location.search);

        const nome =
            parametros.get("nome") || "Convidado Especial";

        nomeConvidado.textContent = nome;

        if (nome.length > 22) {
            nomeConvidado.classList.add("nomeLongo");
        }

        if (nome.length > 34) {
            nomeConvidado.classList.add("nomeMuitoLongo");
        }

        const rangido =
            new Audio("click.mp3.mp3");

        rangido.volume = 0.55;

        let abriu = false;

        grupoEtiqueta.addEventListener("click", function () {
            if (abriu) return;

            abriu = true;

            rangido.currentTime = 0;
            rangido.play().catch(() => {});

            grupoEtiqueta.classList.add("soltar");

            setTimeout(function () {
                telaEtiqueta.style.opacity = "0";
            }, 520);

            setTimeout(function () {
                telaEtiqueta.style.display = "none";
                telaConvite.classList.add("aberto");
            }, 950);
        });
    </script>

</body>

</html>
