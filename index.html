<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite Eduardo & Leila</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #120b07;
        }

        .tela {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TELA DA NOVA ETIQUETA */

        #telaEtiqueta {
            opacity: 1;
            transition: opacity 0.7s ease;
        }

        #etiqueta {
            width: min(96vw, 900px);
            max-height: 94vh;
            object-fit: contain;

            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;

            filter: drop-shadow(
                0 22px 44px rgba(0, 0, 0, 0.62)
            );

            /*
            O movimento parte da região do furo
            existente no lado esquerdo da etiqueta.
            */
            transform-origin: 19% 52%;

            transition:
                transform 1s cubic-bezier(.22, .75, .25, 1),
                opacity 0.7s ease,
                filter 0.3s ease;
        }

        #etiqueta:hover {
            transform: scale(1.012);

            filter: drop-shadow(
                0 28px 52px rgba(0, 0, 0, 0.7)
            );
        }

        /*
        Simula o barbante soltando:
        a etiqueta gira pelo furo e cai.
        */
        #etiqueta.soltar {
            transform:
                translate(5vw, 31vh)
                rotate(13deg)
                scale(0.88);

            opacity: 0;
        }

        /* TELA DO CONVITE */

        #telaConvite {
            visibility: hidden;
            opacity: 0;

            background: #120b07;

            transition:
                opacity 1.15s ease;
        }

        #convite {
            width: 100vw;
            height: 100vh;

            object-fit: contain;

            transform: scale(0.965);
            filter: brightness(0.86);

            transition:
                transform 1.15s ease,
                filter 1.15s ease;
        }

        #telaConvite.aberto {
            visibility: visible;
            opacity: 1;
        }

        #telaConvite.aberto #convite {
            transform: scale(1);
            filter: brightness(1);
        }

        /* AJUSTE PARA CELULAR */

        @media (max-width: 600px) {
            #etiqueta {
                width: 98vw;
                max-height: 90vh;
            }

            #etiqueta.soltar {
                transform:
                    translate(4vw, 27vh)
                    rotate(11deg)
                    scale(0.86);

                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #etiqueta,
            #telaEtiqueta,
            #telaConvite,
            #convite {
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>

<body>

    <section
        id="telaEtiqueta"
        class="tela">

        <img
            id="etiqueta"
            src="novaetiqueta.png"
            alt="Etiqueta destinada ao convidado">

    </section>

    <section
        id="telaConvite"
        class="tela">

        <img
            id="convite"
            src="conviteoficial.png"
            alt="Convite de Eduardo e Leila">

    </section>

    <script>
        const etiqueta =
            document.getElementById("etiqueta");

        const telaEtiqueta =
            document.getElementById("telaEtiqueta");

        const telaConvite =
            document.getElementById("telaConvite");

        const rangido =
            new Audio("click.mp3.mp3");

        rangido.volume = 0.55;

        let abriu = false;

        etiqueta.addEventListener("click", function () {
            if (abriu) return;

            abriu = true;

            rangido.currentTime = 0;
            rangido.play().catch(() => {});

            etiqueta.classList.add("soltar");

            setTimeout(function () {
                telaEtiqueta.style.opacity = "0";
            }, 520);

            setTimeout(function () {
                telaEtiqueta.style.display = "none";
                telaConvite.classList.add("aberto");
            }, 950);
        });
    </script>

</body>

</html>
