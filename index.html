<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
        rel="stylesheet">

    <title>Convite Eduardo & Leila</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #120b07;
        }
    
        

.tela {
position: fixed;
inset: 0;
display: flex;
justify-content: center;
align-items: center;
}
/* ==========================
TELA DE ABERTURA
========================== */
#loading {
    position: fixed;
    inset: 0;

    background: #120b07;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 9999;

    transition: opacity 1s ease;
}
#loading.ocultar{
    opacity:0;
    pointer-events:none;
}
#tituloLoading{

    font-family: Georgia, serif;

    font-size: clamp(30px,3vw,48px);

    letter-spacing:6px;

    color:#d9c6a2;

    margin-bottom:18px;

    width:100%;

    text-align:center;

    line-height:1.05;

}
#subtituloLoading{
    font-family: Georgia, serif;

    font-size:14px;

    color:#9f8b6f;

    letter-spacing:2px;

    margin-bottom:28px;
}
#barra{
    width:220px;

    height:2px;

    background:#3b2d20;

    overflow:hidden;
}
#barra::after{
    content:"";

    display:block;

    width:0;

    height:100%;

    background:#c7a35b;

    animation:carregar 1.35s linear forwards;
}
@keyframes carregar{
    from{

        width:0;
    }

    to{

        width:100%;
    }

}
/* TELA DA ETIQUETA */
        #telaEtiqueta {
            opacity: 1;
            transition: opacity 0.7s ease;
        }

        #grupoEtiqueta {
            position: relative;
            width: min(96vw, 900px);
            max-height: 94vh;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;

            filter: drop-shadow(
                0 22px 44px rgba(0, 0, 0, 0.62)
            );

            transform-origin: 19% 52%;

            transition:
                transform 1s cubic-bezier(.22, .75, .25, 1),
                opacity 0.7s ease,
                filter 0.3s ease;
        }

        #grupoEtiqueta:hover {
            transform: scale(1.012);

            filter: drop-shadow(
                0 28px 52px rgba(0, 0, 0, 0.7)
            );
        }

        #grupoEtiqueta.soltar {
            transform:
                translate(5vw, 31vh)
                rotate(13deg)
                scale(0.88);

            opacity: 0;
        }

        #etiqueta {
            display: block;
            width: 100%;
            height: auto;
            max-height: 94vh;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        /* NOME PERSONALIZADO */

        #nomeConvidado {
            position: absolute;

            left: 31%;
            right: 15%;
            top: 55%;

            transform: translateY(-50%);

            text-align: center;
            white-space: nowrap;

            font-family: "Allura", cursive;
            font-size: clamp(42px, 5.2vw, 82px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.3px;

            color: #3b210f;

            text-shadow:
                0 1px 0 rgba(255, 228, 170, 0.45),
                0 2px 3px rgba(70, 35, 10, 0.28);

            pointer-events: none;
        }

        #nomeConvidado.nomeLongo {
            font-size: clamp(36px, 4.4vw, 68px);
        }

        #nomeConvidado.nomeMuitoLongo {
            font-size: clamp(30px, 3.6vw, 56px);
        }

        /* TELA DO CONVITE */

        #telaConvite {
            visibility: hidden;
            opacity: 0;

            background: #120b07;

            transition:
                opacity 1.15s ease;
        }

        #convite {
            width: 118vw;
            height: 118vh;

            object-fit: contain;

            transform: scale(1.18);
            filter: brightness(0.86);

            transition:
                transform 1.15s ease,
                filter 1.15s ease;
        }

        #telaConvite.aberto {
            visibility: visible;
            opacity: 1;
        }

        #telaConvite.aberto #convite {
            transform: scale(1.23);
            filter: brightness(1);
        }

        /* AJUSTE PARA CELULAR */

        @media (max-width: 600px) {
            #tituloLoading{

        letter-spacing:3px;

        font-size:34px;
            }

            #grupoEtiqueta.soltar {
                transform:
                    translate(4vw, 27vh)
                    rotate(11deg)
                    scale(0.86);

                opacity: 0;
            }

            #etiqueta {
                max-height: 90vh;
            }

            #nomeConvidado {
                left: 30%;
                right: 14%;
                top: 55%;

                font-size: clamp(34px, 8.5vw, 64px);
            }

            #nomeConvidado.nomeLongo {
                font-size: clamp(29px, 7.3vw, 54px);
            }

            #nomeConvidado.nomeMuitoLongo {
                font-size: clamp(25px, 6vw, 45px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #grupoEtiqueta,
            #telaEtiqueta,
            #telaConvite,
            #convite {
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>
<body>
 <div id="loading">
        <div id="tituloLoading">
    ARQUIVOS DO<br>TEMPO
</div>

        <div id="subtituloLoading">
            Preparando seu registro...
        </div>

        <div id="barra"></div>

    </div>
    <section
        id="telaEtiqueta"
        class="tela">

        <div id="grupoEtiqueta">

            <img
                id="etiqueta"
                src="etiqueta_limpa.png.png"
                alt="Etiqueta destinada ao convidado">

            <div id="nomeConvidado">
                Convidado Especial
            </div>

        </div>

    </section>

  <section
    id="telaConvite"
    class="tela">

    <img
        id="convite"
      src="oficial.png?v=2"
        alt="Convite de Eduardo e Leila">

</section>

    <script>
            const loading =
        document.getElementById("loading");

    window.addEventListener("load", function () {
setTimeout(function () {
            loading.classList.add("ocultar");

            setTimeout(function () {

                loading.style.display = "none";
                setTimeout(escreverNome,200);
}, 800);
        }, 1600);

    });
        const grupoEtiqueta =
            document.getElementById("grupoEtiqueta");

        const nomeConvidado =
            document.getElementById("nomeConvidado");

        const telaEtiqueta =
            document.getElementById("telaEtiqueta");

        const telaConvite =
            document.getElementById("telaConvite");

        const convidados = {
    "tia-celia": "Tia Celia e Família",
    "marcelo": "Marcelo e Claudia",
    "marcio-familia": "Marcio e Família",
    "cintia": "Cintia e Família",
    "luciane": "Luciane",
    "mae-noiva": "Mãe da Noiva",
    "joao-pedro": "João Pedro",
    "isis": "Isís Bandeira",
    "marcio-bandeira": "Marcio Bandeira",
    "geisa": "Geiza Bandeira",
    "lorenzo": "Lorenzo Bandeira",
    "tio-oliveira": "Tio Oliveira",
    "tia-branca": "Tia Branca",
    "rodrigo": "Primo Rodrigo",
    "meri": "Meri Barrim",
    "ilma": "Madrinha Hilma e Família",
    "martinha": "Martinha",
    "mirian": "Mirian Bortolam",
    "garca": "Garça e Gi",
    "Vagner": "Wagner Amarante",
    "debora": "Debora Dalagnola",
    "mae-noivo": "Mãe do Noivo",
    "atlas": "Atlas",
    "roque": "Roque",
    "josue": "Josué e Família",
    "graziele": "Graziele Zanlorenzi",
    "gilson": "Gilson e Família",
    "tio-neco": "Tio Neco",
     "tio-ze-barrim": "Tio Zé Barrim"
};

const parametros = new URLSearchParams(window.location.search);

const chave = parametros.get("c");

const nome = convidados[chave] || "Convidado Especial";

        if (nome.length > 22) {

            nomeConvidado.classList.add("nomeLongo");
        }

        if (nome.length > 34) {
            nomeConvidado.classList.add("nomeMuitoLongo");
        }

        nomeConvidado.textContent = "";

        function escreverNome() {
            let i = 0;
            nomeConvidado.textContent = "";
            const timer = setInterval(function () {
                nomeConvidado.textContent += nome.charAt(i);
                i++;
                if (i >= nome.length) clearInterval(timer);
            },45);
        }

        const rangido =
            new Audio("click.mp3.mp3");
rangido.volume = 0.55;
        let abriu = false;

        grupoEtiqueta.addEventListener("click", function () {
            if (abriu) return;

            abriu = true;

            rangido.currentTime = 0;
            rangido.play().catch(() => {});

            grupoEtiqueta.classList.add("soltar");

            setTimeout(function () {
                telaEtiqueta.style.opacity = "0";
            }, 520);

            setTimeout(function () {
                telaEtiqueta.style.display = "none";
                telaConvite.classList.add("aberto");
            }, 950);
        });
    </script>

</body>
</html>
